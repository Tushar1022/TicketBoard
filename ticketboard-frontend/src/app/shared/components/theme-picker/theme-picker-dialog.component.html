<div class="theme-dialog-shell">
  <div class="theme-dialog-head">
    <div class="head-icon-wrap">
      <mat-icon>palette</mat-icon>
    </div>
    <div class="head-text">
      <h2>Application Themes</h2>
      <p>Pick a design system for your workspace — every theme is free and applies instantly.</p>
    </div>
  </div>

  <div class="theme-dialog-body">
    <tb-theme-picker></tb-theme-picker>
  </div>

  <div class="theme-dialog-foot">
    <span class="foot-note">
      <mat-icon>auto_awesome</mat-icon>
      Saved automatically on your device.
    </span>
    <button mat-flat-button class="done-btn" mat-dialog-close>Done</button>
  </div>
</div>
