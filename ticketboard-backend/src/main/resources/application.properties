spring.application.name=ticket-board

# Server Port
server.port=8080

# File Upload Limits (files >25 MB are auto-routed to a Drive link by EmailService)
spring.servlet.multipart.max-file-size=45MB
spring.servlet.multipart.max-request-size=50MB

# Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/ticket_board?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin#9090}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Logging Levels
logging.level.com.aurionpro.ticketboard=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.pattern.console=%clr(%d{HH:mm:ss.SSS}){faint} %clr(%5p) %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n

# JWT Configuration
app.jwt.secret=${APP_JWT_SECRET:9a618248b64db62d15b300a30fbeeb405ddeb9cb7733d7338e6037c480b80e45}
app.jwt.expiration-ms=86400000

# CORS Configuration
app.cors.allowed-origins=http://localhost:4200,http://localhost:3000,http://localhost:4210,http://localhost:4212

# Mail Attachments Storage
app.mail.upload-dir=${MAIL_UPLOAD_DIR:uploads/mail}

# Mail / SMTP Configuration
spring.mail.host=${SPRING_MAIL_HOST:smtp.office365.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:dev-mail@aurionpro.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:DevPass#2026}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Allow omitted/null boolean & numeric primitives in JSON bodies
spring.jackson.deserialization.fail-on-null-for-primitives=false
